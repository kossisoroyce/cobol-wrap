<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cobol-wrap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --accent: #f43f5e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, var(--bg-dark), #030712 80%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, var(--primary), #818cf8);
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
            margin-top: 0.5rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .model-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .model-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), #818cf8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .model-card:hover::before { opacity: 1; }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .model-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .model-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .endpoints-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .endpoint-tag {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #cbd5e1;
        }

        .actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-primary {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }

        .btn-danger {
            background: transparent;
            color: var(--accent);
            border-color: rgba(244, 63, 94, 0.4);
        }

        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-danger:hover { background: rgba(244, 63, 94, 0.15); }

        .empty-state {
            text-align: center;
            padding: 4rem;
            background: var(--surface);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover { color: var(--text); }

        pre {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.75rem;
            color: #cbd5e1;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            font-size: 0.875rem;
            z-index: 200;
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success { border-color: #22c55e; color: #4ade80; }
        .toast.error { border-color: var(--accent); color: #fb7185; }

    </style>
</head>
<body>

    <header>
        <div>
            <div class="title">cobol-wrap</div>
            <div class="subtitle">Next-Gen COBOL Local Execution Environment</div>
        </div>
        <div style="text-align: right; color: var(--text-muted); font-size: 0.85rem;">
            Registry: ~/.cobol-wrap/models/
        </div>
    </header>

    <div class="container" id="app">
        <div class="loader" id="loader"></div>
        <div class="models-grid" id="grid" style="display: none;"></div>
        <div class="empty-state" id="empty" style="display: none;">
            <p style="color: var(--text-muted); margin-bottom: 1rem;">No COBOL models loaded.</p>
            <p style="font-family: monospace; background: rgba(0,0,0,0.5); padding: 0.5rem; border-radius: 4px;">$ cobol-wrap load ACCTMGMT.cbl</p>
        </div>
    </div>

    <!-- Spec Modal -->
    <div class="modal-overlay" id="spec-modal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-title" id="modal-title">OpenAPI Spec</div>
            <pre id="modal-body">Loading...</pre>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => { t.className = 'toast'; }, 3000);
        }

        function closeModal() {
            document.getElementById('spec-modal').classList.remove('active');
        }

        async function viewSpec(name) {
            document.getElementById('modal-title').textContent = `${name} — OpenAPI Spec`;
            document.getElementById('modal-body').textContent = 'Loading...';
            document.getElementById('spec-modal').classList.add('active');
            try {
                const res = await fetch(`/api/models/${encodeURIComponent(name)}/spec`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const spec = await res.json();
                document.getElementById('modal-body').textContent = JSON.stringify(spec, null, 2);
            } catch (err) {
                document.getElementById('modal-body').textContent = `Error loading spec: ${err.message}`;
            }
        }

        async function deleteModel(name, cardEl) {
            if (!confirm(`Remove model "${name}" from the registry?`)) return;
            try {
                const res = await fetch(`/api/models/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                cardEl.style.transition = 'opacity 0.4s';
                cardEl.style.opacity = '0';
                setTimeout(() => cardEl.remove(), 400);
                showToast(`Model "${name}" removed.`, 'success');
                // If grid is now empty, show empty state
                setTimeout(() => {
                    if (!document.querySelector('.model-card')) {
                        document.getElementById('grid').style.display = 'none';
                        document.getElementById('empty').style.display = 'block';
                    }
                }, 500);
            } catch (err) {
                showToast(`Failed to delete: ${err.message}`, 'error');
            }
        }

        // Close modal on overlay click
        document.getElementById('spec-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/models');
                const data = await res.json();

                document.getElementById('loader').style.display = 'none';

                if (data.models.length === 0) {
                    document.getElementById('empty').style.display = 'block';
                    return;
                }

                const grid = document.getElementById('grid');
                grid.style.display = 'grid';

                data.models.forEach(model => {
                    const date = new Date(model.modified * 1000).toLocaleDateString();
                    const tags = model.endpoints.map(ep => `<span class="endpoint-tag">${ep}</span>`).join('');

                    const card = document.createElement('div');
                    card.className = 'model-card';
                    card.innerHTML = `
                        <div class="model-header">
                            <div class="model-name">${model.name}</div>
                            <div class="badge">GNU COBOL</div>
                        </div>
                        <div class="model-stats">
                            <div>${model.size_kb} KB</div>
                            <div>Loaded ${date}</div>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">API Routes:</div>
                        <div class="endpoints-list">
                            ${tags || '<span class="endpoint-tag" style="opacity:0.5">No explicit routes</span>'}
                        </div>
                        <div class="actions">
                            <button class="btn btn-primary" onclick="viewSpec('${model.name}')">View Spec</button>
                            <button class="btn btn-danger" onclick="deleteModel('${model.name}', this.closest('.model-card'))">Remove</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').innerHTML = '<div class="empty-state" style="border-color:#f43f5e; color:#f43f5e">Failed to connect to local registry daemon.</div>';
            }
        });
    </script>
</body>
</html>
