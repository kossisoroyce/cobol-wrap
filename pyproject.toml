[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-wrap"
version = "1.0.0"
description = "Auto-generate production REST APIs from COBOL source files — one command to load, one command to serve"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kossiso Royce", email = "kossiso@electricsheep.africa"},
]
keywords = ["cobol", "rest", "api", "fastapi", "gnucobol", "mainframe", "modernization", "legacy", "openapi", "pydantic", "ctypes"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Office/Business :: Financial",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Other",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/kossisoroyce/cobol-wrap"
Documentation = "https://github.com/kossisoroyce/cobol-wrap#readme"
Repository = "https://github.com/kossisoroyce/cobol-wrap"
Issues = "https://github.com/kossisoroyce/cobol-wrap/issues"
Changelog = "https://github.com/kossisoroyce/cobol-wrap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
serve = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
graphql = ["strawberry-graphql>=0.200.0"]
kafka = ["faststream[kafka]>=0.4.0"]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
all = ["cobol-wrap[serve,graphql,kafka,telemetry]"]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
    "ruff>=0.4",
]

[project.scripts]
cobol-wrap = "cobol_wrap.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cobol_wrap*"]

[tool.setuptools.package-data]
cobol_wrap = ["py.typed", "dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 60

[tool.coverage.run]
source = ["cobol_wrap"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]
